---
name: Build and Deploy CiCD pipeline for backend
on:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Create .env file from secrets
        run: echo "${{ secrets.ENV_CONTENTS }}" > .env
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ideosapp/ideosbackend:latest
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to EC2 instance
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: >
            # Define variables

            IMAGE_NAME="ideosapp/ideosbackend:latest"

            PORT=5000

            ENV_FILE=".env"


            # Stop and remove the existing container

            EXISTING_CONTAINER=$(sudo docker ps -aq --filter "name=ideosbackend")

            if [ ! -z "$EXISTING_CONTAINER" ]; then
                echo "Stopping and removing existing container..."
                sudo docker stop $EXISTING_CONTAINER
                sudo docker rm $EXISTING_CONTAINER
            else
                echo "No existing container found."
            fi


            # Remove the existing image

            echo "Removing Docker image ${IMAGE_NAME}..."

            sudo docker rmi ${IMAGE_NAME} || true


            # Pull the latest image from Docker Hub

            echo "Pulling Docker image ${IMAGE_NAME}..."

            sudo docker pull ${IMAGE_NAME}


            # Ensure .env file exists on the server with correct permissions

            if [ ! -f "$ENV_FILE" ]; then
                echo ".env file not found on server. Ensure it exists and is accessible."
                exit 1
            fi


            # Run the Docker container with environment variables from the .env file

            echo "Running Docker container ${IMAGE_NAME} on port ${PORT}..."

            sudo docker run -d -p ${PORT}:${PORT} \
                --name ideosbackend \
                --env-file $ENV_FILE \
                ${IMAGE_NAME}

            # Verify if the container is running successfully

            if [ "$(sudo docker ps -q -f name=ideosbackend)" ]; then
                echo "Container is running successfully."
            else
                echo "Failed to start the container."
                exit 1
            fi
